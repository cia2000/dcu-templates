      <text x="820" y="1097">Guion de tareas y observación</text>
      <text x="820" y="1123">Registro de observaciones y métricas</text>
      <text x="820" y="1149">Informe de evaluación</text>
      <text x="820" y="1356">Backlog de mejoras</text>
      <text x="820" y="1382">Versiones revisadas de requisitos, criterios y decisiones</text>
      <text x="820" y="1408">Prototipo revisado · Nueva evaluación</text>
      <text x="820" y="1434">Backlog del MVP actualizado · Historial de cambios</text>
    </g>

    <rect x="180" y="1530" width="1320" height="150" rx="14" fill="#e1eeec" stroke="#a7c3cc" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#174f5b">
      <text x="840" y="1566" font-size="23" font-weight="700">DURANTE TODO EL CICLO</text>
      <text x="840" y="1601" font-size="22">Accesibilidad · Privacidad · Seguridad · Ética · Diversidad · Contexto mobile-first</text>
      <text x="840" y="1633" font-size="21">Matriz de trazabilidad · Fuentes y límites · Identificadores · Responsable · Versiones y estados</text>
      <text x="840" y="1664" font-size="20">Las plantillas se enlazan y actualizan; no se duplican ni se rellenan por rutina.</text>
    </g>
    <text x="840" y="1718" text-anchor="middle" font-size="20" fill="#42566b">Evaluar un prototipo no equivale a verificar una implementación ni a validar para toda la población.</text>
  </g>
</svg>
