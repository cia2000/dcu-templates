    <g font-size="18" font-weight="700" fill="#226574">
      <text x="205" y="185">ACTIVIDADES</text><text x="820" y="185">ARTEFACTOS DE REFERENCIA</text>
      <text x="205" y="470">ACTIVIDADES</text><text x="820" y="470">ARTEFACTOS DE REFERENCIA</text>
      <text x="205" y="755">ACTIVIDADES</text><text x="820" y="755">ARTEFACTOS DE REFERENCIA</text>
      <text x="205" y="1040">ACTIVIDADES</text><text x="820" y="1040">ARTEFACTOS DE REFERENCIA</text>
      <text x="205" y="1325">ACTIVIDADES</text><text x="820" y="1325">ARTEFACTOS DE REFERENCIA</text>
    </g>
    <g font-size="23" fill="#142b42">
      <text x="205" y="225">Delimitar preguntas, supuestos y participantes.</text>
      <text x="205" y="265">Preparar métodos y participación responsable.</text>
      <text x="205" y="305">Recoger evidencias sobre tareas y contexto.</text>
      <text x="205" y="510">Sintetizar patrones y formular necesidades.</text>
      <text x="205" y="550">Precisar objetivos, reglas y requisitos.</text>
      <text x="205" y="590">Delimitar el MVP y criterios de aceptación.</text>
      <text x="205" y="795">Generar y comparar alternativas.</text>
      <text x="205" y="835">Representar contenido, flujos y estados.</text>
      <text x="205" y="875">Prototipar lo necesario para comprobar.</text>
      <text x="205" y="1080">Preparar tareas neutrales y condiciones.</text>
      <text x="205" y="1120">Observar el uso y contrastar criterios.</text>
      <text x="205" y="1160">Analizar barreras, resultados y límites.</text>
      <text x="205" y="1365">Priorizar hallazgos y justificar cambios.</text>
      <text x="205" y="1405">Revisar los artefactos afectados.</text>
      <text x="205" y="1445">Repetir la comprobación y registrar lo aprendido.</text>
    </g>
    <g font-size="21" fill="#42566b">
      <text x="820" y="216">Brief del problema y del ciclo</text>
      <text x="820" y="242">Plan de investigación y consentimiento · Guion</text>
      <text x="820" y="268">Registro de evidencias</text>
      <text x="820" y="294">Análisis de tareas y contexto</text>
      <text x="820" y="501">Personas y mapa de empatía · Recorrido de usuario</text>
      <text x="820" y="527">Necesidades y oportunidades · Brief revisado</text>
      <text x="820" y="553">Especificación de requisitos · Restricciones transversales</text>
      <text x="820" y="579">Backlog del MVP · Criterios de aceptación</text>
      <text x="820" y="786">Inventario de alternativas · Matriz y registro de decisión</text>
      <text x="820" y="812">Bocetos y wireframes · Arquitectura de pantallas</text>
      <text x="820" y="838">Diagrama de flujo de usuario · Prototipo navegable</text>
