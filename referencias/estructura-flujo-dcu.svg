<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1740" viewBox="0 0 1600 1740" role="img" aria-labelledby="title description">
  <title id="title">Estructura y flujo iterativo del Diseño Centrado en el Usuario</title>
  <desc id="description">Cinco fases con actividades y artefactos. Investigar: preparar el estudio y recoger evidencias mediante brief, plan, guion, registro y análisis de tareas. Definir: sintetizar necesidades, requisitos y alcance mediante personas, empatía, recorrido, necesidades, requisitos, restricciones, backlog y criterios. Diseñar y prototipar: comparar alternativas y representar la solución mediante decisiones, bocetos, arquitectura, flujos, prototipo y especificación. Evaluar: observar tareas y analizar resultados mediante plan de prueba, guion, observaciones y métricas e informe. Mejorar y repetir: priorizar cambios, revisar artefactos y volver a comprobar mediante backlog de mejoras y nuevas versiones. Flechas descendentes indican avance habitual; una línea de retorno permite volver a investigar, definir, diseñar o evaluar. Accesibilidad, privacidad, seguridad, ética y trazabilidad se mantienen durante todo el ciclo.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#226574"/></marker>
    <marker id="return-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#8d5b20"/></marker>
  </defs>
